<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom</title>
  </head>

  <style>
    body {
      font-family: Arial;
    }

    .subscribe-button {
      background-color: black;
      color: white;
      border: none;
      border-radius: 50px;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 15px;
      padding-right: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }

    .css-calculate {
      background-color: green;
      color: white;
      border: none;
      padding-top: 12px;
      padding-bottom: 12px;
      padding-left: 15px;
      padding-right: 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .css-input {
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 10px;
      padding-right: 10px;
      font-size: 15px;
    }
  </style>
  <body>
    <p class="heading">YouTube Subscribe button</p>
    <button class="js-subscribeButton subscribe-button" onclick="subscribe()">
      Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40= +$10 shipping</p>
    <p>Orders over $40= Free shipping</p>
    <input
      placeholder="Cost of order"
      class="js-input css-input"
      onkeydown="enterKey(event)"
    />
    <button class="js-calculate css-calculate" onclick="calculateTotal()">
      Calculate
    </button>
    <p class="js-total"></p>

    <script>
      function enterKey(event) {
        if (event.key === "Enter") {
          calculateTotal();
        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector(".js-input");
        let cost = Number(inputElement.value);
        console.log(typeof cost);

        if (cost < 40) {
          cost = (cost * 100 + 10 * 100) / 100;
        }

        document.querySelector(".js-total").innerHTML = `$${cost}`;
      }

      function subscribe() {
        const buttonElement = document.querySelector(".js-subscribeButton");

        if (buttonElement.innerHTML === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
          buttonElement.classList.add("is-subscribed");
        } else {
          buttonElement.innerHTML = "Subscribe";
          buttonElement.classList.remove("is-subscribed");
        }
      }

      console.log(document.querySelector(".js-type"));

      function typeShow() {
        console.log(document.querySelector(".js-type"));
      }
    </script>
  </body>
</html>
