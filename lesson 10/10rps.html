<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
      body {
        background-color: rgb(25, 25, 25);
        color: white;
        font-family: Arial;
      }

      .title {
        font-size: 30px;
        font-weight: bold;
      }

      .move-icon {
        height: 50px;
      }

      .move-button {
        background-color: transparent;
        border-style: solid;
        border-color: white;
        border-radius: 100px;
        width: 120px;
        height: 120px;
        margin-right: 7px;
        border-width: 2px;
        cursor: pointer;
      }

      .reset-button {
        padding: 10px;
      }
      .css-result {
        font-size: 25px;
        font-weight: bold;
        margin-top: 50px;
      }

      .css-score {
        margin-top: 60px;
      }
    </style>
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button" onclick="playGame('rock')">
      <img class="move-icon" src="../images/rock-emoji.png" />
    </button>

    <button class="move-button" onclick="playGame('paper')">
      <img class="move-icon" src="../images/paper-emoji.png" />
    </button>

    <button class="move-button" onclick="playGame('scissors')">
      <img class="move-icon" src="../images/scissors-emoji.png" />
    </button>

    <p class="js-result css-result"></p>
    <p class="js-move"></p>
    <p class="js-score css-score"></p>

    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScore();
      "
      class="reset-button"
    >
      Reset Score
    </button>

    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };

      let result = "";

      /*
            if (!score) {
              score = {
                wins: 0,
                losses: 0,
                ties: 0
              };
            }
            */

      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        if (playerMove === "scissors") {
          if (computerMove === "rock") {
            result = "You lose.";
          } else if (computerMove === "paper") {
            result = "You win.";
          } else if (computerMove === "scissors") {
            result = "Tie.";
          }
        } else if (playerMove === "paper") {
          if (computerMove === "rock") {
            result = "You win.";
          } else if (computerMove === "paper") {
            result = "Tie.";
          } else if (computerMove === "scissors") {
            result = "You lose.";
          }
        } else if (playerMove === "rock") {
          if (computerMove === "rock") {
            result = "Tie.";
          } else if (computerMove === "paper") {
            result = "You lose.";
          } else if (computerMove === "scissors") {
            result = "You win.";
          }
        }

        if (result === "You win.") {
          score.wins += 1;
        } else if (result === "You lose.") {
          score.losses += 1;
        } else if (result === "Tie.") {
          score.ties += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));

        document.querySelector(".js-move").innerHTML =
          `You <img class="move-icon" src="../images/${playerMove}-emoji.png" />
      <img class="move-icon" src="../images/${computerMove}-emoji.png" /> Computer`;

        updateScore();

        scoreResult();
      }

      function scoreResult() {
        document.querySelector(".js-result").innerHTML = result;
      }

      function updateScore() {
        document.querySelector(".js-score").innerHTML =
          `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
      }

      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = "";

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = "paper";
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = "scissors";
        }

        return computerMove;
      }
    </script>
  </body>
</html>
