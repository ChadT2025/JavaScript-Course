    <button

    <button

        if (cartQuantity + 3 > 10) {

    <button

        console.log('Cart was Reset');
        cartQuantity = 0;
        console.log(`Cart Quantity: ${cartQuantity}`);

    <button
      onclick="
        if (cartQuantity + 3 > 10) {
          alert('Maximum Number of items hit');
        } else {
          cartQuantity += 4;
          console.log(`Cart Quantity: ${cartQuantity}`);
        }
      "
    >
      +4
    </button>

    <button
      onclick="
        if (cartQuantity + 3 > 10) {
          alert('Maximum Number of items hit');
        } else {
          cartQuantity += 5;
          console.log(`Cart Quantity: ${cartQuantity}`);
        }
      "
    >
      +5
    </button>

    <button
      onclick="
        if (cartQuantity - 1 < 0) {
          alert('Not enough items');
        } else {
          cartQuantity--;
          console.log(`Cart Quantity: ${cartQuantity}`);
        }
      "
    >
      Remove from cart
    </button>

    <button
      onclick="
        if (cartQuantity - 2 < 0) {
          alert('Not enough items');
        } else {
          cartQuantity -= 2;
          console.log(`Cart Quantity: ${cartQuantity}`);
        }
      "
    >
      -2
    </button>

    <button
      onclick="
        if (cartQuantity - 3 < 0) {
          alert('Not enough items');
        } else {
          cartQuantity -= 3;
