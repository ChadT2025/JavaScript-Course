<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buttons</title>
    <style>
      .yellow {
        background-color: yellow;
        border-style: solid;
        border-width: 2px;
        border-color: black;
      }

      .orange {
        background-color: orange;
        border-style: solid;
        border-width: 2px;
        border-color: black;
      }
    </style>
  </head>
  <body>
    <button title="ADD" class="yellow">Add to cart</button>
    <button class="orange" onclick="alert('Thank you for your support!')">
      Buy now
    </button>

    <script>
      alert("Welcome!");
    </script>
  </body>
</html>
